<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이선영 작가의 서재</title>
<meta name="description" content="26년 미용실 원장에서 강단의 작가로. 이선영 작가의 전자책을 한곳에서 만나보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700;900&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f2e8; --paper2:#efe7d6; --ink:#1f1b16; --ink2:#4a4339; --muted:#7a7062;
    --seal:#a8322a; --seal-dark:#86271f; --line:#d9cdb6; --white:#fffdf8;
    --serif:'Noto Serif KR',serif; --sans:'Noto Sans KR',sans-serif; --brush:'Nanum Brush Script',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.75;word-break:keep-all}
  a{color:inherit}
  img{max-width:100%}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  /* header */
  header{position:sticky;top:0;z-index:20;background:rgba(247,242,232,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
  .logo{display:flex;align-items:center;gap:12px;text-decoration:none}
  .seal{width:44px;height:44px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:15px;line-height:1.05;text-align:center;letter-spacing:-.5px}
  .logo-text{font-family:var(--serif);font-weight:700;font-size:21px}
  .logo-text small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.5px}
  .menu{display:flex;gap:6px;list-style:none}
  .menu a{display:inline-flex;align-items:center;min-height:48px;padding:0 16px;border-radius:999px;text-decoration:none;font-weight:500;font-size:17px}
  .menu a:hover{background:var(--paper2)}
  .menu a.on{background:var(--ink);color:var(--paper)}
  .menu-btn{display:none;min-height:48px;padding:0 18px;border:1.5px solid var(--ink);border-radius:999px;background:none;font:500 17px var(--sans);cursor:pointer}
  @media (max-width:820px){
    .menu{display:none;position:absolute;top:76px;left:0;right:0;flex-direction:column;background:var(--paper);border-bottom:1px solid var(--line);padding:12px 24px 20px}
    .menu.open{display:flex}
    .menu a{width:100%;font-size:19px}
    .menu-btn{display:inline-flex;align-items:center}
  }
  /* common */
  section{padding:72px 0}
  .eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;color:var(--seal)}
  h1,h2,h3{font-family:var(--serif);line-height:1.35;letter-spacing:-.5px}
  h2.sec{font-size:clamp(28px,4vw,38px);margin:8px 0 12px}
  .lead{font-size:19px;color:var(--ink2);max-width:680px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 28px;border-radius:12px;font:700 18px var(--sans);text-decoration:none;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);transition:transform .15s}
  .btn:hover{transform:translateY(-2px)}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.red{background:var(--seal);border-color:var(--seal);color:#fff}
  .view{display:none}
  .view.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* hero */
  .hero{padding:64px 0 80px;background:radial-gradient(ellipse at 85% 20%,#ead9bd 0,transparent 55%)}
  .hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center}
  .hero h1{font-size:clamp(34px,5.2vw,58px);font-weight:900;margin:14px 0 22px}
  .hero h1 em{font-style:normal;color:var(--seal)}
  .hero .brush{font-family:var(--brush);font-size:34px;color:var(--ink2);line-height:1.2}
  .hero-btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
  .hero-stack{position:relative;height:440px}
  .hero-stack .cover{position:absolute;width:220px;box-shadow:0 22px 40px rgba(40,25,10,.28)}
  .hero-stack .cover:nth-child(1){left:0;top:40px;transform:rotate(-7deg)}
  .hero-stack .cover:nth-child(2){left:110px;top:0;z-index:2}
  .hero-stack .cover:nth-child(3){left:215px;top:60px;transform:rotate(6deg)}
  @media (max-width:900px){.hero-grid{grid-template-columns:1fr}.hero-stack{height:360px;max-width:420px;margin:0 auto;width:100%}.hero-stack .cover{width:170px}.hero-stack .cover:nth-child(2){left:30%}.hero-stack .cover:nth-child(3){left:auto;right:0}}
  .stats{display:flex;flex-wrap:wrap;gap:28px;margin-top:36px;padding-top:28px;border-top:1px solid var(--line)}
  .stats b{display:block;font-family:var(--serif);font-size:30px;color:var(--seal)}
  .stats span{font-size:15px;color:var(--muted)}
  /* covers */
  .cover{aspect-ratio:2/3;border-radius:4px 10px 10px 4px;position:relative;overflow:hidden;color:var(--c-fg,#fff);background:var(--c-bg);padding:9% 10%;display:flex;flex-direction:column;justify-content:space-between}
  .cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7%;background:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,255,255,.08) 60%,transparent)}
  .cover .c-top{font-size:.62em;letter-spacing:1.5px;opacity:.85;position:relative}
  .cover .c-title{font-family:var(--serif);font-weight:900;font-size:1.35em;line-height:1.3;position:relative}
  .cover .c-sub{font-size:.6em;opacity:.85;margin-top:.6em;line-height:1.5;position:relative}
  .cover .c-author{font-size:.7em;font-weight:500;position:relative;display:flex;justify-content:space-between;align-items:center}
  .cover .c-mark{width:1.9em;height:1.9em;border-radius:3px;background:var(--seal);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:.62em;font-weight:900}
  .cover .c-deco{position:absolute;right:-18%;bottom:18%;width:75%;aspect-ratio:1;border-radius:50%;background:var(--c-deco,rgba(255,255,255,.12))}
  .cover.soon{background:repeating-linear-gradient(135deg,#e8dfcc 0 14px,#e2d7c1 14px 28px);color:var(--muted);border:2px dashed #c9bb9f}
  /* grid */
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 36px}
  .filters button{min-height:50px;padding:0 22px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);font:500 17px var(--sans);cursor:pointer;color:var(--ink)}
  .filters button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:36px 28px}
  .card{text-decoration:none;display:flex;flex-direction:column;gap:14px;cursor:pointer}
  .card .cover{font-size:20px;box-shadow:0 10px 24px rgba(40,25,10,.18);transition:transform .2s,box-shadow .2s}
  .card:hover .cover{transform:translateY(-6px);box-shadow:0 18px 34px rgba(40,25,10,.26)}
  .card .tag{font-size:14px;font-weight:700;color:var(--seal)}
  .card h3{font-size:21px}
  .card p{font-size:16px;color:var(--ink2);line-height:1.6}
  .card .more{font-weight:700;font-size:16px;text-decoration:underline;text-underline-offset:4px}
  /* author teaser */
  .band{background:var(--ink);color:var(--paper)}
  .band .lead{color:#d8cfbf}
  .band .eyebrow{color:#e0806f}
  .author-grid{display:grid;grid-template-columns:300px 1fr;gap:56px;align-items:center}
  .portrait{aspect-ratio:3/4;border-radius:14px;background:linear-gradient(160deg,#3a332a,#2a241d);border:1px solid #4d4438;display:grid;place-items:center;text-align:center;color:#a99d89;font-size:15px;padding:20px}
  .portrait .big{font-family:var(--brush);font-size:64px;color:var(--paper);display:block;line-height:1}
  @media (max-width:820px){.author-grid{grid-template-columns:1fr}.portrait{max-width:280px}}
  .timeline{list-style:none;margin-top:28px;border-left:2px solid var(--seal);padding-left:24px}
  .timeline li{position:relative;margin-bottom:20px}
  .timeline li::before{content:"";position:absolute;left:-31px;top:10px;width:12px;height:12px;border-radius:50%;background:var(--seal)}
  .timeline b{font-family:var(--serif);font-size:19px}
  .timeline span{display:block;font-size:17px;opacity:.85}
  .light .timeline span{color:var(--ink2)}
  /* lecture */
  .lec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:32px}
  .lec{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:28px}
  .lec .ico{font-family:var(--brush);font-size:40px;color:var(--seal);line-height:1}
  .lec h3{font-size:21px;margin:10px 0 8px}
  .lec p{font-size:16px;color:var(--ink2)}
  .lec .link-book{display:inline-block;margin-top:12px;font-size:15px;font-weight:700;color:var(--seal);text-decoration:none;cursor:pointer}
  .contact-box{margin-top:40px;background:var(--paper2);border-radius:20px;padding:36px;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center}
  @media (max-width:720px){.contact-box{grid-template-columns:1fr}}
  .note{font-size:15px;color:var(--muted)}
  /* detail */
  .back{display:inline-flex;align-items:center;min-height:48px;font-weight:700;text-decoration:none;cursor:pointer;margin-bottom:20px}
  .detail{display:grid;grid-template-columns:340px 1fr;gap:56px;align-items:start}
  .detail .cover{font-size:28px;box-shadow:0 24px 44px rgba(40,25,10,.28);position:sticky;top:110px}
  @media (max-width:860px){.detail{grid-template-columns:1fr}.detail .cover{position:relative;top:0;max-width:280px;font-size:23px}}
  .detail h1{font-size:clamp(30px,4.4vw,44px);font-weight:900;margin:8px 0 6px}
  .detail .subtitle{font-size:20px;color:var(--ink2);font-family:var(--serif)}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
  .meta span{font-size:15px;padding:6px 14px;border-radius:999px;background:var(--paper2)}
  .callout{border-left:4px solid var(--seal);background:var(--white);padding:16px 20px;border-radius:0 12px 12px 0;margin:18px 0;font-size:17px}
  .buy{background:var(--white);border:1.5px solid var(--line);border-radius:18px;padding:24px;margin:24px 0}
  .buy h3{font-size:20px;margin-bottom:4px}
  .buy-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:16px}
  .store{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px;padding:0 20px;border-radius:12px;background:var(--ink);color:var(--paper);font-weight:700;font-size:18px;text-decoration:none;transition:background .15s}
  .store:hover{background:var(--seal)}
  .store.off{background:#e9e1d1;color:#8c816f;cursor:default;font-weight:500}
  .store.off small{font-size:13px}
  .block{margin-top:40px}
  .block h2{font-size:25px;margin-bottom:14px}
  .for-list{list-style:none}
  .for-list li{padding:12px 0 12px 36px;position:relative;border-bottom:1px dashed var(--line)}
  .for-list li::before{content:"✓";position:absolute;left:4px;top:11px;color:var(--seal);font-weight:900;font-size:20px}
  .toc{counter-reset:t;list-style:none}
  .toc li{counter-increment:t;padding:10px 0;display:flex;gap:16px;border-bottom:1px solid var(--line)}
  .toc li::before{content:counter(t,decimal-leading-zero);font-family:var(--serif);font-weight:900;color:var(--seal);min-width:32px}
  .quote{font-family:var(--serif);font-size:21px;line-height:1.9;background:var(--paper2);padding:32px 36px;border-radius:16px;position:relative}
  .quote::before{content:"“";position:absolute;left:14px;top:-14px;font-size:80px;color:var(--seal);opacity:.5}
  .series{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .series div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px}
  .series b{color:var(--seal);font-family:var(--serif);margin-right:6px}
  .related{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:22px}
  .related .card .cover{font-size:15px}
  .related .card h3{font-size:17px}
  /* follow */
  .follow{background:var(--paper2);border-radius:24px;padding:44px;text-align:center}
  .follow .btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:22px}
  footer{border-top:1px solid var(--line);padding:40px 0 56px;font-size:15px;color:var(--muted)}
  footer .row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px}
  footer a{text-decoration:none;font-weight:500;color:var(--ink2)}
  .to-top{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;border:none;background:var(--ink);color:var(--paper);font-size:22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2);display:none}
  .to-top.show{display:block}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="#home"><span class="seal">이선<br>영</span><span class="logo-text">이선영 작가의 서재<small>쓰고, 가르치고, 다시 걷는 사람</small></span></a>
    <button class="menu-btn" id="menuBtn" aria-label="메뉴 열기">☰ 메뉴</button>
    <ul class="menu" id="menu">
      <li><a href="#home" data-nav="home">처음으로</a></li>
      <li><a href="#books" data-nav="books">책 둘러보기</a></li>
      <li><a href="#author" data-nav="author">작가 소개</a></li>
      <li><a href="#lecture" data-nav="lecture">강의·문의</a></li>
    </ul>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap row">
    <div><b style="font-family:var(--serif);color:var(--ink)">이선영 작가의 서재</b><br>책은 작가와(jakkawa)를 통해 교보문고·예스24·알라딘 등 온라인 서점에서 판매됩니다.<br>이 홈페이지는 책 소개 공간이며, 결제는 각 서점에서 이루어집니다.</div>
    <div style="text-align:right">
      <a href="https://blog.naver.com/syy7189">네이버 블로그</a> · <a href="#lecture">강의 문의</a><br>
      © 2026 이선영. All rights reserved.
    </div>
  </div>
</footer>
<button class="to-top" id="toTop" aria-label="맨 위로">↑</button>

<script>
/* =========================================================
   ✏️ 링크 넣는 곳 (서점 승인이 나면 여기 주소만 채우면 됩니다)
   비어 있으면 "서점 등록 중" 회색 버튼으로 보입니다.
   ========================================================= */
const STORES = {
  kyobo:  "교보문고",
  yes24:  "예스24",
  aladin: "알라딘",
  ridi:   "리디",
  millie: "밀리의서재",
  bookcube:"북큐브",
  kmong:  "크몽"
};

const BOOKS = [
  {
    id:"flower", cat:"growth", tag:"실화 소설",
    title:"쓰러진 자리마다 꽃이 핀다",
    subtitle:"시장에서 양말을 팔던 어머니와 가위를 들던 딸의 이야기",
    hook:"1970년부터 2026년까지, 어머니와 딸 두 사람의 시선이 교차하며 써 내려간 삶의 기록.",
    colors:{bg:"linear-gradient(165deg,#7a2e2a,#4b1a18)",deco:"rgba(255,214,200,.12)"},
    meta:["실화 소설","약 200쪽","전자책"],
    intro:[
      "자식만 바라보며 시장에서 양말을 팔던 어머니. 그리고 스무여섯 해 동안 가위를 들고 새벽까지 미용실 불을 밝혔던 딸.",
      "이 책은 두 여자의 시선이 번갈아 흐르며, 가난과 희생, 죽음과 싸운 시간, 어머니를 떠나보낸 뒤의 3년, 그리고 공부로 다시 삶의 끈을 붙잡기까지의 이야기를 담았습니다.",
      "넘어지고 또 넘어졌지만, 쓰러진 그 자리마다 결국 꽃이 피었다는 것. 지금 어딘가에서 주저앉아 있는 당신에게 건네는 이야기입니다."
    ],
    forWho:["부모님, 특히 어머니를 떠올리면 마음이 먹먹해지는 분","인생의 고비 앞에서 다시 일어설 힘이 필요한 분","실화를 바탕으로 한 가족 이야기를 좋아하는 분"],
    toc:["1970, 시장 골목의 어머니","가위를 든 딸","새벽 두 시의 미용실","죽음의 문턱에서","어머니를 보내고, 3년","다시 펜을 든 날"],
    note:null,
    links:{kyobo:"",yes24:"",aladin:"",ridi:"",millie:"",bookcube:""}
  },
  {
    id:"barefoot", cat:"growth", tag:"자기 성장 에세이·워크북",
    title:"맨발로 걷는 나에게",
    subtitle:"나를 다시 쓰는 자기 사용 설명서",
    hook:"신발을 벗고 땅을 밟던 그날부터 시작된, 나를 다시 알아가는 연습.",
    colors:{bg:"linear-gradient(165deg,#3f5d47,#22352a)",deco:"rgba(220,240,200,.12)"},
    meta:["에세이 + 실천 워크북","약 200쪽","A5 전자책"],
    intro:[
      "26년의 미용 인생, 그리고 마흔여섯에 시작한 새로운 공부. 삶의 큰 고비를 지난 뒤 작가는 맨발로 걷기 시작했습니다.",
      "이 책은 세계의 자기계발 고전에서 길어 올린 지혜와 작가 자신의 삶을 엮은 '나 사용 설명서'입니다. 읽고 끝나는 책이 아니라, 장마다 나를 돌아보고 적어 보는 워크북이 함께합니다.",
      "부드럽게, 그러나 포기하지 않고. 오늘 한 걸음을 내딛고 싶은 당신에게."
    ],
    forWho:["인생 2막을 준비하며 나를 다시 정리하고 싶은 분","읽는 것에서 그치지 않고 직접 써 보며 변화하고 싶은 분","맨발 걷기, 느린 습관에 관심 있는 분"],
    toc:["멈춰 둔 시간을 꺼내다","나라는 사람의 사용법","포기하지 않는 마음의 근육","맨발로 배우는 하루","다시 쓰는 나의 지도"],
    note:null,
    links:{kyobo:"",yes24:"",aladin:"",ridi:"",millie:"",bookcube:""}
  },
  {
    id:"bloom", cat:"growth", tag:"마음 에세이",
    title:"멈춘 마음이 다시 피어나는",
    subtitle:"흔들리지 않는 마음자리와 결정의 힘",
    hook:"결정 앞에서 자꾸 멈추는 마음에게, 철학자의 문장과 한 사람의 일기가 건네는 답.",
    colors:{bg:"linear-gradient(165deg,#5b4a7a,#2f2545)",deco:"rgba(230,215,255,.12)"},

/* ---------- 부품 ---------- */
function cover(b){
  if(b.soon) return `<div class="cover soon"><div class="c-top">COMING SOON</div><div><div class="c-title" style="color:var(--ink2)">다음 책</div><div class="c-sub">준비 중입니다</div></div><div class="c-author">이선영 <span class="c-mark">印</span></div></div>`;
  const c=b.colors;
  return `<div class="cover" style="--c-bg:${c.bg};--c-deco:${c.deco||''};${c.fg?'--c-fg:'+c.fg:''}">
    <span class="c-deco"></span>
    <div class="c-top">${b.tag}</div>
    <div><div class="c-title">${b.title}</div><div class="c-sub">${b.subtitle}</div></div>
    <div class="c-author">이선영 지음 <span class="c-mark">印</span></div>
  </div>`;
}
function card(b){
  return `<a class="card" href="#book-${b.id}">${cover(b)}
    <div><div class="tag">${CATS[b.cat]}</div><h3>${b.soon?'곧 만나요':b.title}</h3><p>${b.hook}</p></div>
    ${b.soon?'':'<span class="more">책 자세히 보기 →</span>'}</a>`;
}
function storeButtons(b){
  return Object.keys(b.links).map(k=>{
    const url=b.links[k];
    return url
      ? `<a class="store" href="${url}" target="_blank" rel="noopener">${STORES[k]}에서 보기 <span>→</span></a>`
      : `<span class="store off">${STORES[k]} <small>서점 등록 중</small></span>`;
  }).join("");
}

    <h2 class="sec">책으로 만나고, 강의로 다시 만납니다</h2>
    <p class="lead">기관·도서관·학교·교육원 출강을 받습니다. 대상과 시간에 맞춰 내용을 조정해 드립니다.</p>
    <div class="lec-grid">${lec.map(l=>`<div class="lec"><div class="ico">${l.i}</div><h3>${l.t}</h3><p>${l.d}</p>${l.b?`<a class="link-book" href="#book-${l.b}">연계 도서 『${BOOKS.find(x=>x.id===l.b).title}』 →</a>`:''}</div>`).join("")}</div>
    <div class="contact-box">
      <div>
        <h3 style="font-size:24px">강의 문의</h3>
        <p style="margin-top:8px">원하시는 <b>주제 · 대상 · 인원 · 날짜와 시간 · 장소</b>를 적어 보내 주시면 확인 후 연락드리겠습니다.</p>
        <p class="note" style="margin-top:8px">문의 이메일·연락처: <b>(준비 중)</b> — 지금은 네이버 블로그로 문의해 주세요.</p>
      </div>
      <a class="btn red" href="https://blog.naver.com/syy7189">블로그로 문의하기</a>
    </div>
  </div></section>`;
}

function viewDetail(id){
  const b=BOOKS.find(x=>x.id===id);
  if(!b||b.soon) return viewBooks();
  const others=BOOKS.filter(x=>x.id!==b.id && !x.soon).slice(0,8).sort((a,c)=>(a.cat===b.cat?-1:1)-(c.cat===b.cat?-1:1)).slice(0,3);
  return `<section><div class="wrap">
    <a class="back" href="#books">← 책 목록으로</a>
    <div class="detail">
      ${cover(b)}
      <div>
        <div class="eyebrow">${CATS[b.cat]} · ${b.tag}</div>
        <h1>${b.title}</h1>
        <p class="subtitle">${b.subtitle}</p>
        <div class="meta">${b.meta.map(m=>`<span>${m}</span>`).join("")}<span>이선영 지음</span></div>
        ${b.note && b.id==='code'?`<div class="callout">${b.note}</div>`:''}
        <p class="lead">${b.hook}</p>

        <div class="buy">
          <h3>이 책을 살 수 있는 곳</h3>
          <p class="note">버튼을 누르면 해당 서점의 책 페이지로 이동합니다. 결제는 서점에서 이루어집니다.</p>
          <div class="buy-grid">${storeButtons(b)}</div>
        </div>

        <div class="block"><h2>이런 분께 권합니다</h2><ul class="for-list">${b.forWho.map(f=>`<li>${f}</li>`).join("")}</ul></div>
        <div class="block"><h2>책 소개</h2>${b.intro.map(p=>`<p style="margin-bottom:14px">${p}</p>`).join("")}</div>
        ${b.series?`<div class="block"><h2>시리즈 구성</h2><div class="series">${b.series.map((s,i)=>`<div><b>${String(i+1).padStart(2,'0')}</b>${s}</div>`).join("")}</div></div>`:''}
        ${b.toc?`<div class="block"><h2>차례 미리 보기</h2><ol class="toc">${b.toc.map(t=>`<li>${t}</li>`).join("")}</ol></div>`:''}
        <div class="block"><h2>책 속 한 대목</h2><div class="quote">${b.intro[b.intro.length-1]}</div><p class="note" style="margin-top:8px">※ 본문 발췌로 바꿔 넣을 자리입니다.</p></div>
        ${b.note && b.id!=='code'?`<div class="callout">${b.note}</div>`:''}
        <div class="block"><h2>함께 읽으면 좋은 책</h2><div class="related">${others.map(card).join("")}</div></div>
      </div>
    </div>
  </div></section>`;
}

function follow(){
  return `<section><div class="wrap"><div class="follow">
    <div class="eyebrow">새 책 소식</div>
    <h2 class="sec">새 책이 나오면 가장 먼저 알려 드릴게요</h2>
    <p class="lead" style="margin:0 auto">네이버 블로그와 인스타그램에서 작가의 하루와 새 책 이야기를 전합니다.</p>
    <div class="btns"><a class="btn" href="https://blog.naver.com/syy7189">네이버 블로그 바로가기</a><span class="btn ghost" style="cursor:default">인스타그램 (주소 준비 중)</span></div>
  </div></div></section>`;
}

/* ---------- 이동 ---------- */
const app=document.getElementById('app');
function route(){
  const h=(location.hash||'#home').slice(1);
  let html, nav=h;
  if(h.startsWith('book-')){html=viewDetail(h.slice(5)); nav='books';}
  else if(h==='books') html=viewBooks();
  else if(h==='author') html=viewAuthor();
  else if(h==='lecture') html=viewLecture();
  else {html=viewHome(); nav='home';}
  app.innerHTML=`<div class="view on">${html}</div>`;
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===nav));
  document.getElementById('menu').classList.remove('open');
  window.scrollTo(0,0);
  const f=document.getElementById('filters');
  if(f) f.addEventListener('click',e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    f.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===btn));
    const c=btn.dataset.cat;
    document.getElementById('bookGrid').innerHTML=BOOKS.filter(b=>c==='all'||b.cat===c).map(card).join("");
  });
}
window.addEventListener('hashchange',route);
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('menu').classList.toggle('open'));
const toTopBtn=document.getElementById('toTop');
window.addEventListener('scroll',()=>toTopBtn.classList.toggle('show',scrollY>600));
toTopBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
route();
</script>
</body>
